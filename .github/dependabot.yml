# Opens pull requests when dependencies have new versions.
# Review the PRs and let CI run; do not merge blindly.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "terraform"
    directories:
      - "/infra/bootstrap"
      - "/infra/foundation"
      - "/infra/envs/dev"
      - "/infra/modules/vpc"
    schedule:
      interval: "weekly"
