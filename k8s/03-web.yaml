apiVersion: apps/v1
kind: Deployment
metadata:
  name: hrms-web
  namespace: hrms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hrms-web
  template:
    metadata:
      labels:
        app: hrms-web
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql 3306; do echo waiting for mysql; sleep 3; done"]
      containers:
        - name: web
          image: hrms:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef:
                name: hrms-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: hrms-secrets, key: DB_PASSWORD }
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef: { name: hrms-secrets, key: SECRET_KEY }
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 5000 }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: hrms-web
  namespace: hrms
spec:
  selector:
    app: hrms-web
  ports:
    - port: 5000
      targetPort: 5000