apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: hrms
spec:
  clusterIP: None            # headless: gives the pod a stable DNS name
  selector:
    app: mysql
  ports:
    - port: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: hrms
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: hrms-secrets, key: MYSQL_ROOT_PASSWORD }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: hrms-secrets, key: DB_PASSWORD }
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef: { name: hrms-config, key: DB_NAME }
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef: { name: hrms-config, key: DB_USER }
            - name: TZ
              valueFrom:
                configMapKeyRef: { name: hrms-config, key: TZ }
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi