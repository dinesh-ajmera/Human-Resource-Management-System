{% extends "base.html" %}
{% block title %}Error{% endblock %}
{% block content %}
<div class="errbox card">
  {% if code %}<div class="code">{{ code }}</div>{% else %}<div class="code">⚠</div>{% endif %}
  <h1>Something went wrong</h1>
  <p class="muted">{{ message or "An unexpected problem occurred. Please try again." }}</p>
  <div class="actions">
    <a class="btn ghost" href="javascript:history.back()">Go back</a>
    <a class="btn" href="{{ url_for('dashboard') }}">Home</a>
  </div>
</div>
{% endblock %}
