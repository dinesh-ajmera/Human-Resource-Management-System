{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth">
  <div class="card">
    <div class="logo">H</div>
    <h1>Welcome back</h1>
    <p class="muted sub">Log in to your HR portal</p>
    {% if data %}<div class="notice error" role="alert">{{ data }}</div>{% endif %}
    <form action="{{ url_for('login') }}" method="post" class="stack">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pw">
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <button type="button" data-toggle-password="password">Show</button>
        </div>
      </div>
      <button class="btn block" type="submit">Log in</button>
    </form>
    <p class="alt muted">New here? <a href="{{ url_for('signup') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
