- name: Deploy HRMS
  hosts: hrms
  become: true
  vars:
    app_dir: /opt/hrms
    repo_url: https://github.com/dinesh-ajmera/Human-Resource-Management-System.git

  tasks:
    - name: Install Docker, Compose and Git
      ansible.builtin.apt:
        name: [docker.io, docker-compose-v2, git]
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Make sure Docker is running and starts on boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Get the latest app code
      ansible.builtin.git:
        repo: "{{ repo_url }}"
        dest: "{{ app_dir }}"
        version: main
        force: true

    - name: Write the .env file (secrets come from the vault)
      ansible.builtin.template:
        src: env.j2
        dest: "{{ app_dir }}/.env"
        mode: "0600"
      no_log: true

    - name: Build and start the app
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ app_dir }}"

    - name: Wait until the app reports healthy
      ansible.builtin.uri:
        url: http://localhost:5000/health
        status_code: 200
      register: health
      until: health.status == 200
      retries: 20
      delay: 5